name = "moon-card-trade-api"
main = "server/index.mjs"
compatibility_date = "2026-08-07"

[triggers]
crons = ["*/5 * * * *"]

routes = [
  { pattern = "api.mooncard.top", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "moon-card-trade"
# 部署前替换为你的 D1 database_id（wrangler d1 create moon-card-trade 后可见）
database_id = "d2559ccf-f086-4edf-b7cf-43d1d870a2c9"
